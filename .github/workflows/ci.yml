name: CI - Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Playwright Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Application
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: 'true'
          USE_TEST_DB: 'true'

      - name: Generate Consolidated Test Report (HTML & JSON)
        if: always()
        run: npm run report:generate
        env:
          CI: 'true'

      - name: Upload Consolidated Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-test-report
          path: |
            daily-report.html
            daily-report.json
            playwright-report/test-results.json
            playwright-report/
          retention-days: 14

      - name: Upload Failure Artifacts (Screenshots & Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ci-failures
          path: test-results/
          retention-days: 14

